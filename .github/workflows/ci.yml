name: CI
on:
  push:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:-3475'
          pub-cache-key: 'flutter-pub-:os:-:channel:-:version:-:arch:-:hash:-3475'
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm install
        working-directory: rules_test
      - run: >
          firebase emulators:exec --only firestore --project demo-aquaconnect
          "cd rules_test && node --test"
